; BinDetective configuration file
; Restart the service for changes to take effect.
; Values are read at startup; invalid values fall back to defaults.
; Precedence: command line > environment variable > this file > tray saved config (registry) > default
;
; Maximum number of concurrent analysis sessions (1 - 4096, default 256)
max_sessions = 256
;
; Worker threads handling HTTP requests (1 - 128, 0 = auto = CPU cores)
worker_threads = 0
;
; Session idle timeout in seconds (60 - 86400, default 600)
session_ttl = 600
;
; Max HTTP request body size in MiB (1 - 1024, default 16)
request_body_limit_mib = 16
;
; HTTP listening bind address (default 127.0.0.1; 0.0.0.0 = all interfaces, LAN exposed)
; leave empty to fall back to tray saved config (registry) / default
bind_address =
;
; HTTP listening port (1 - 65535, default 8000)
; leave empty to fall back to tray saved config (registry) / default
port =
;
; Access token for X-Auth-Token header; leave empty for the built-in default key
token =
;
; Read-only mode: 1 = reject rewriting interfaces (0/1, default 0; empty = fall back to registry)
read_only =
;
; Hide console window at startup (0/1, default 0; empty = fall back to registry)
auto_hide_console =
